<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#121413">
<script>/* dark unless this device chose light in Settings */try{var t=localStorage.getItem('murib-theme')}catch(e){}document.documentElement.dataset.theme=t==='light'?'light':'dark';if(t==='light')document.querySelector('meta[name="theme-color"]').content='#F3F4F0';</script>
<title>مُعرِب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;700&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans:wght@400;500&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* مُعرِب — ink on paper; colour only ever means grammar.
   Every colour is a token on :root; the dark block below is a drop-in. */
:root {
  color-scheme: light;
  --bg: #F3F4F0; --surface: #FFFFFF; --surface-2: #EBEDE7; --sheet: var(--surface);
  --ink: #1A1E23; --on-ink: #FFFFFF; --ink-2: #545D66; --line: #D8DCD3; --line-2: #C3C8BC;
  --seal: #B3362B; --hl: #FBEBA6; --warn: #8A5A00; --warn-bg: #F8EBCF;
  --ok: #2D7A4E; --bad: #B3362B;
  --knob: #FFFFFF; --on-seal: #FFFFFF;
  --scrim: rgba(26, 30, 35, .5); --shadow-sheet: 0 -8px 32px rgba(26, 30, 35, .22);
  --r-subj: #2557C7; --r-pred: #C0392B; --r-obj: #1E8449; --r-attr: #7D44B5; --r-adv: #9C5C00; --r-comp: #0C8291; --r-pivot: #56689F; --r-other: #6B7380;
  --other-ink: #4A525C;
  --f-display: "Noto Kufi Arabic", "Geeza Pro", sans-serif;
  --f-ui: "IBM Plex Sans Arabic", "Geeza Pro", "Segoe UI", sans-serif;
  --f-read: "Noto Naskh Arabic", "Geeza Pro", serif;
  --f-zh: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-py: "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --tab-h: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121413; --surface: #1A1C1B; --surface-2: #242725; --sheet: #222523;
    --ink: #ECEEEA; --on-ink: #121413; --ink-2: #A5ABA4; --line: #2E322F; --line-2: #5E645E;
    --seal: #C9473C; --hl: #5B4A12; --warn: #E7B55B; --warn-bg: #3A2E14; --ok: #6BCB93; --bad: #FF8A7A;
    --r-subj: #86A8FF; --r-pred: #FF8C7D; --r-obj: #6FD39A; --r-attr: #C29BF0; --r-adv: #F2B451; --r-comp: #5ED0DD; --r-pivot: #A9B5E6; --r-other: #A0A8B4;
    --other-ink: #C4CAD0;
    --scrim: rgba(0, 0, 0, .62); --shadow-sheet: 0 -8px 32px rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121413; --surface: #1A1C1B; --surface-2: #242725; --sheet: #222523;
  --ink: #ECEEEA; --on-ink: #121413; --ink-2: #A5ABA4; --line: #2E322F; --line-2: #5E645E;
  --seal: #C9473C; --hl: #5B4A12; --warn: #E7B55B; --warn-bg: #3A2E14; --ok: #6BCB93; --bad: #FF8A7A;
  --r-subj: #86A8FF; --r-pred: #FF8C7D; --r-obj: #6FD39A; --r-attr: #C29BF0; --r-adv: #F2B451; --r-comp: #5ED0DD; --r-pivot: #A9B5E6; --r-other: #A0A8B4;
  --other-ink: #C4CAD0;
  --scrim: rgba(0, 0, 0, .62); --shadow-sheet: 0 -8px 32px rgba(0, 0, 0, .6);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
/* The page itself never scrolls or bounces; the app and the lock screen each scroll inside a
   full-screen layer. Otherwise iPhone's pull-to-bounce drags the fixed tab bar off screen. */
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
#app, #lock-root:not(:empty) { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.7 var(--f-ui); -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
h1 { font: 700 26px/1.4 var(--f-display); }
h2 { font: 600 15px/1.5 var(--f-ui); }
h3 { font: 600 16px/1.5 var(--f-ui); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); font-size: 14px; }
.pad { padding: 16px; }
.center { text-align: center; }
.calm { color: var(--ink-2); padding: 16px 0; }
.ic { width: 22px; height: 22px; flex: none; }
[lang="zh-CN"] { font-family: var(--f-zh); }

/* shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
#app:not([data-route="library"]) .top { display: none; }
.top-in { max-width: 760px; margin: 0 auto; height: 60px; display: flex; align-items: center; gap: 8px; padding: 12px max(20px, env(safe-area-inset-left, 0px)) 0 max(20px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; min-height: 44px; font: 700 20px var(--f-display); }
.brand-t { white-space: nowrap; }
.seal { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--seal); color: var(--on-seal); font: 700 17px/1 var(--f-zh); }
.save-ind { font-size: 12px; color: var(--ink-2); margin-inline-start: auto; white-space: nowrap; }
.save-ind.saving::before, .save-ind.saved::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-inline-end: 5px; }
.save-ind.saving::before { background: var(--warn); }
.save-ind.saved::before { background: var(--ink-2); }
.ibtn { display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; background: none; border: 0; border-radius: 10px; color: var(--ink); padding: 0; }
.ibtn .ic { width: 22px; height: 22px; }
.ibtn:hover { background: var(--surface-2); }
.top-in .ibtn:last-child { margin-inline-end: -10px; }
.back { margin-inline-start: -12px; }
.lock-txt { display: none; }
.banner { background: var(--warn-bg); color: var(--warn); display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 20px; font-size: 14px; flex-wrap: wrap; }
.col { max-width: 760px; margin: 0 auto; padding: 0 max(20px, env(safe-area-inset-right, 0px)) calc(var(--tab-h) + 28px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
body.has-qbar .col { padding-bottom: calc(var(--tab-h) + 100px + env(safe-area-inset-bottom, 0px)); }
.nav { position: fixed; z-index: 25; bottom: 0; left: 0; right: 0; display: flex; align-items: stretch; height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line); }
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: 0; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 600; }
.nav .nav-plus { display: grid; place-items: center; width: 44px; height: 30px; border-radius: 10px; background: var(--ink); color: var(--on-ink); }
.nav .nav-plus .ic { width: 20px; height: 20px; }
.nav .nav-new { font-weight: 600; }

/* screen headers */
.sh-title { padding: 24px 0 0; }
.sh-title p { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
.sh-bar { display: flex; align-items: center; gap: 4px; height: 60px; padding-top: 8px; }
.sh-bar h1 { font-size: 20px; }
.sec-wrap { display: flex; flex-direction: column; gap: 12px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-h .muted { font-size: 12.5px; }
.page { display: flex; flex-direction: column; gap: 28px; padding-top: 12px; }
.page.p24 { padding-top: 24px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group.g10 { gap: 10px; }

/* components */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: 12px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font-size: 16px; font-weight: 600; }
.btn.primary { background: var(--ink); color: var(--on-ink); }
.btn.ghost { border: 1px solid var(--line-2); color: var(--ink); font-weight: 500; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--on-ink); }
.btn.neg { border-color: var(--bad); color: var(--bad); }
.btn.pos { border-color: var(--ok); color: var(--ok); }
.btn.sm { min-height: 44px; padding: 0 14px; font-size: 14.5px; }
.btn.block { display: flex; width: 100%; }
.btn.big { min-height: 56px; font-size: 17px; }
.btn.lg { min-height: 54px; font-size: 17px; }
.btn:disabled { opacity: .45; cursor: default; }
.link { background: none; border: 0; color: var(--ink); text-decoration: underline; padding: 10px 0; min-height: 44px; }
.pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; line-height: 1.7; color: var(--ink-2); padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line-2); white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.role { color: var(--c, var(--ink)); background: color-mix(in srgb, var(--c, var(--ink)) 11%, var(--surface)); }
.chip.role.g-other { color: var(--other-ink); }
.chip.em-chip { background: var(--hl); color: var(--ink); }
.tag { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); border: 1px solid var(--line-2); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.bar { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; flex: 1; min-width: 60px; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--ink); transition: width .3s; }
.err { color: var(--bad); margin: 8px 0; }
.ok-note { color: var(--ok); margin: 8px 0; }
.hint { color: var(--ink-2); font-size: 13.5px; line-height: 1.7; }
.warn-note { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; line-height: 1.7; }
.warn-note .ic { width: 20px; height: 20px; margin-top: 3px; }
.note { font-size: 14px; line-height: 1.85; margin: 4px 0; padding-inline-start: 10px; border-inline-start: 3px solid var(--line); }
.plain { margin: 6px 0; padding: 0; list-style: none; }
.plain-ol, .tips { padding-inline-start: 22px; margin: 6px 0; }
.confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; font-size: 15px; }
.lbl { font-size: 14px; font-weight: 500; display: block; }
.inp { width: 100%; min-height: 52px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 0 16px; outline: 0; }
.inp:focus { border-color: var(--ink); box-shadow: 0 0 0 .5px var(--ink); }
.zh-inp { font-size: 19px; font-weight: 700; font-family: var(--f-zh); text-align: left; }
textarea.inp { resize: vertical; line-height: 1.8; padding: 12px 16px; }
textarea.zh-inp { font-weight: 400; font-size: 17px; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 44px; border: 1px solid transparent; background: none; border-radius: 9px; padding: 0 10px; font-size: 15px; font-weight: 500; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; border-color: var(--line); }
.seg.sm button { font-size: 14px; }
.seg.rd button { min-height: 40px; font-size: 14.5px; }
.seg.col2 { flex-direction: column; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tog { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--ink-2); font-size: 14px; font-weight: 500; }
.tog.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chk { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; cursor: pointer; }
.chk input { width: 22px; height: 22px; accent-color: var(--ink); margin: 0; flex: none; }
.chk.big { display: flex; }
.sw-row { display: flex; align-items: center; justify-content: space-between; min-height: 56px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.sw-row label { font-size: 16px; font-weight: 600; flex: 1; min-height: 44px; display: flex; align-items: center; }
input.switch { appearance: none; -webkit-appearance: none; position: relative; width: 52px; height: 28px; border-radius: 14px; background: var(--line-2); margin: 8px 0; cursor: pointer; flex: none; border: 0; }
input.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--knob); transition: inset-inline-start .15s; }
input.switch:checked { background: var(--ink); }
input.switch:checked::after { inset-inline-start: 27px; }
.skel { display: grid; gap: 8px; padding: 6px 0; color: var(--ink-2); font-size: 14px; }
.skel i { display: block; height: 14px; border-radius: 6px; background: var(--surface-2); animation: pulse 1.2s ease-in-out infinite; }
.skel i + i { width: 70%; }
@keyframes pulse { 50% { opacity: .45; } }

/* library */
.strip { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.strip div { flex: 1; padding: 16px 4px 14px; text-align: center; display: flex; flex-direction: column; }
.strip div + div { border-inline-start: 1px solid var(--line); }
.strip b { font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.strip span { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; line-height: 1.4; }
.tcard { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.tcard-main { cursor: pointer; display: flex; flex-direction: column; gap: 12px; }
.tc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); }
.tc-zh { display: block; font: 700 21px/1.4 var(--f-zh); text-align: left; }
.tc-ar { font-size: 14.5px; color: var(--ink-2); margin-top: 2px; }
.tc-prog { display: flex; flex-direction: column; gap: 6px; }
.tc-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tc-foot { display: flex; justify-content: flex-end; margin: -4px 0 -4px; }
.empty { padding: 16px; display: grid; gap: 12px; justify-items: start; }
.notice { padding: 16px; }

/* new text + proofread */
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.thumb { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.th-img { position: relative; width: 100%; aspect-ratio: 3 / 4; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.th-img img { width: 100%; height: 100%; object-fit: contain; transition: transform .2s; }
.th-no { position: absolute; bottom: 6px; inset-inline-end: 6px; min-width: 20px; height: 20px; border-radius: 999px; background: var(--ink); color: var(--on-ink); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.th-bar { display: flex; }
.th-bar .ibtn .ic { width: 20px; height: 20px; }
.preview { background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 16px; font: 400 17px/1.95 var(--f-zh); display: flex; flex-direction: column; gap: 12px; }
mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 2px; }
.doubt { background: var(--warn-bg); border-bottom: 2px dotted var(--warn); }
.legend-hl { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.legend-hl i { width: 18px; height: 10px; border-radius: 3px; background: var(--hl); display: block; }
.foot-act { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.foot-act .muted { text-align: center; font-size: 12.5px; }

/* text view */
.th { padding: 8px 0 14px; }
.th-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: 2px; }
.th-zh { font: 700 24px/1.35 var(--f-zh); text-align: left; }
.th-ar { font-size: 14.5px; color: var(--ink-2); margin-top: 2px; }
.th-row .pill { margin-top: 6px; }
.th-prog { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; display: flex; overflow-x: auto; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 -20px; padding: 0 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; height: 46px; padding: 0 14px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-2); font-size: 15px; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tabbody { padding-top: 14px; display: flex; flex-direction: column; gap: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.legend span { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.legend i { width: 14px; height: 3px; border-radius: 2px; background: var(--c); display: block; }
.legend i.hl { background: var(--hl); height: 8px; }
.g-subj { --c: var(--r-subj); } .g-pred { --c: var(--r-pred); } .g-obj { --c: var(--r-obj); } .g-attr { --c: var(--r-attr); }
.g-adv { --c: var(--r-adv); } .g-comp { --c: var(--r-comp); } .g-pivot { --c: var(--r-pivot); } .g-other { --c: var(--r-other); }

/* sentence card */
.sent { margin: 0 -8px; }
.sect { padding: 20px 16px; border-top: 1px solid var(--line); }
.sect:first-child { border-top: 0; padding-top: 6px; }
.sect > h3 { margin-bottom: 10px; }
.sect-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sect-h h3 { margin: 0; }
.sc-label { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pager { display: flex; align-items: center; justify-content: space-between; height: 44px; }
.pager .btns { display: flex; margin-inline-end: -12px; }
.pager .ibtn:disabled { opacity: .35; cursor: default; }
.pager .ibtn .ic { width: 20px; height: 20px; }
.zh-line { display: flex; flex-wrap: wrap; row-gap: 8px; font: 400 26px/1.25 var(--f-zh); text-align: left; }
.zh-line .zh-plain { line-height: 1.9; }
.sent .zh-line { margin-top: 8px; }
/* A flex column, not native ruby layout: Chrome spreads the letters of short pinyin such as Āijí apart. */
ruby { display: inline-flex; flex-direction: column-reverse; align-items: center; font-family: var(--f-zh); font-size: 26px; line-height: 1.25; }
rt { display: block; font: 400 10.5px/1.2 var(--f-py); color: var(--ink-2); }
.nopy rt { display: none; }
.wd { display: inline-flex; flex-direction: column; align-items: center; vertical-align: top; margin: 0 3px; cursor: pointer; }
.wd.pu { cursor: default; margin: 0 -1px 0 -2px; }
.wd .wb { align-self: stretch; height: 3px; border-radius: 2px; background: var(--c, transparent); margin-top: 3px; display: block; }
.wd .wn { font: 400 10px/1 var(--f-py); font-style: normal; color: var(--ink-2); margin-top: 3px; min-height: 10px; }
.wd.em ruby { background: var(--hl); border-radius: 3px; }
.wd.nw ruby { background: color-mix(in srgb, var(--ink) 9%, transparent); border-radius: 3px; }
.wd.em.nw ruby { background: var(--hl); }
.wd.hi ruby { background: var(--hl); border-radius: 3px; }
/* reading: no role colour, a plain flow */
.rdz .zh-line { row-gap: 10px; font-size: 24px; }
.rdz ruby { font-size: 24px; }
.rdz rt { font-size: 10px; }
.rdz .wd { margin: 0 2px; padding: 0 2px; border-radius: 6px; }
.rdz .wd .wb { display: none; }
.rdz .wd .wn.none { display: none; }

<script>
/* src/core.js */
/* مُعرِب — core.js
 * The prompts sent to Claude, the text pipeline (bold markers, sentences, chunks,
 * word alignment) and the normalizers that turn Claude's JSON into stored records.
 * Lead-owned: app.js consumes window.MuribCore and must not re-implement any of this.
 * Also loads under Node (module.exports) so the fixture and tests can use it. */
(function (root) {
  'use strict';

  const PROMPT_VERSION = 2;

  // ───────────── Text utilities ─────────────

  const PUNCT_CHAR = /[\p{P}\p{S}\s]/u;
  const PUNCT_ALL = /[\p{P}\p{S}\s]/gu;
  const TERMINATORS = '。！？!?；;';
  const CLOSERS = '”’"\'」』）)》】';

  const isPunct = (ch) => PUNCT_CHAR.test(ch);
  const stripPunct = (s) => String(s ?? '').replace(PUNCT_ALL, '');
  const str = (v) => (v == null ? '' : String(v)).trim();
  const arr = (v) => (Array.isArray(v) ? v : []);

  /** "a**b**c" → { clean: "abc", ranges: [[1, 2]] }; ranges are [start, end) in clean. */
  function parseBold(marked) {
    const parts = String(marked ?? '').split('**');
    const unbalanced = parts.length % 2 === 0; // odd number of markers: ignore the last one
    let clean = '';
    const ranges = [];
    parts.forEach((p, i) => {
      const bold = i % 2 === 1 && !(unbalanced && i === parts.length - 1);
      if (bold && p) ranges.push([clean.length, clean.length + p.length]);
      clean += p;
    });
    return { clean, ranges };
  }

  /** Split clean text into sentences: [{ text, start, end }] with offsets into the input. */
  function splitSentences(text) {
    const out = [];
    const n = text.length;
    let start = 0;
    const push = (s, e) => {
      while (s < e && /\s/.test(text[s])) s++;
      let t = e;
      while (t > s && /\s/.test(text[t - 1])) t--;
      if (t <= s) return;
      if (!stripPunct(text.slice(s, t)) && out.length) {
        // stray closing marks belong to the previous sentence
        const prev = out[out.length - 1];
        prev.end = t;
        prev.text = text.slice(prev.start, t);
        return;
      }
      out.push({ text: text.slice(s, t), start: s, end: t });
    };
    for (let i = 0; i < n; i++) {
      if (!TERMINATORS.includes(text[i])) continue;
      let j = i + 1;
      while (j < n && (TERMINATORS.includes(text[j]) || CLOSERS.includes(text[j]))) j++;
      push(start, j);
      start = j;
      i = j - 1;
    }
    push(start, n);
    return out;
  }

  /** Editor text → paragraphs. Every non-empty line is one paragraph. */
  function parseEditor(text) {
    return String(text ?? '')
      .split(/\n+/)
      .map((l) => l.trim())
      .filter((l) => stripPunct(l.replace(/\*\*/g, '')));
  }

  /**
   * Turn a reviewed text into numbered sentences and analysis chunks.
   * input: { title, paragraphs } — strings that may carry **bold** markers.
   * returns {
   *   title, paragraphs,                         // clean strings (markers removed)
   *   sentences: [{ id: 'S1', para, text, bold: [string], boldRanges: [[s, e]] }],
   *   chunks:    [{ id: 'c1', para, sentenceIds: ['S1', …] }]
   * }
   * para 0 is the title; paragraphs are numbered from 1. Chunks never cross a paragraph.
   * One sentence per chunk by default: each call is short, so sentences appear one by one,
   * a dropped connection costs one sentence, and the shared prompt prefix is cached.
   * Store the result with the text: ids must not change after analysis.
   */
  function buildDocument({ title = '', paragraphs = [] } = {}, { maxChars = 100, maxSentences = 1 } = {}) {
    const blocks = [];
    if (stripPunct(parseBold(title).clean)) blocks.push({ para: 0, marked: title });
    paragraphs
      .filter((p) => stripPunct(parseBold(p).clean))
      .forEach((p, i) => blocks.push({ para: i + 1, marked: p }));

    const sentences = [];
    const chunks = [];
    for (const block of blocks) {
      const { clean, ranges } = parseBold(block.marked);
      let current = null;
      for (const s of splitSentences(clean)) {
        const boldRanges = ranges
          .map(([a, b]) => [Math.max(a, s.start) - s.start, Math.min(b, s.end) - s.start])
          .filter(([a, b]) => b > a);
        const sentence = {
          id: 'S' + (sentences.length + 1),
          para: block.para,
          text: s.text,
          bold: boldRanges.map(([a, b]) => s.text.slice(a, b)).filter((b) => stripPunct(b)),
          boldRanges,
        };
        sentences.push(sentence);
        const len = stripPunct(sentence.text).length;
        if (!current || current.chars + len > maxChars || current.sentenceIds.length >= maxSentences) {
          current = { id: 'c' + (chunks.length + 1), para: block.para, sentenceIds: [], chars: 0 };
          chunks.push(current);
        }
        current.sentenceIds.push(sentence.id);
        current.chars += len;
      }
    }
    chunks.forEach((c) => delete c.chars);
    return {
      title: parseBold(title).clean.trim(),
      paragraphs: blocks.filter((b) => b.para > 0).map((b) => parseBold(b.marked).clean.trim()),
      sentences,
      chunks,
    };
  }

  /**
   * Lay a sentence's analyzed words over its printed text, for rendering.
   * returns { tokens, ok } where tokens are
   *   { type: 'word', index, text, start, end }  — index into words
   *   { type: 'punct', text }                    — punctuation / spaces
   *   { type: 'raw', text }                      — printed characters no word covered (segmentation slip)
   * ok is false when any word could not be placed or any character was left uncovered.
   */
  function alignWords(text, words) {
    const tokens = [];
    let pos = 0;
    let ok = true;
    const pushGap = (a, b) => {
      if (b <= a) return;
      let run = '';
      let runType = null;
      for (const ch of text.slice(a, b)) {
        const t = isPunct(ch) ? 'punct' : 'raw';
        if (t !== runType && run) {
          tokens.push({ type: runType, text: run });
          run = '';
        }
        runType = t;
        run += ch;
        if (t === 'raw') ok = false;
      }
      if (run) tokens.push({ type: runType, text: run });
    };
    arr(words).forEach((w, index) => {
      const target = w && w.w;
      if (!target) return;
      const at = text.indexOf(target, pos);
      if (at === -1 || stripPunct(text.slice(pos, at)).length > 8) {
        ok = false;
        return;
      }
      pushGap(pos, at);
      tokens.push({ type: 'word', index, text: target, start: at, end: at + target.length });
      pos = at + target.length;
    });
    pushGap(pos, text.length);
    return { tokens, ok };
  }

  const PUNCT_PINYIN = {
    '，': ',', '。': '.', '、': ',', '；': ';', '：': ':', '？': '?', '！': '!',
    '“': '"', '”': '"', '‘': "'", '’': "'", '《': '«', '》': '»', '（': '(', '）': ')',
  };

  /** Whole-sentence pinyin built from the words, punctuation kept in Latin form. */
  function sentencePinyin(text, words) {
    const { tokens } = alignWords(text, words);
    let out = '';
    for (const t of tokens) {
      if (t.type === 'word') {
        const py = (words[t.index] && words[t.index].py) || t.text;
        const attach = /^(le|zhe|guo)$/.test(py) && /[\p{L}]$/u.test(out); // 写了 → xiěle
        out += (out && !attach && !/[«(]$/.test(out) ? ' ' : '') + py;
      } else if (t.type === 'punct') {
        out += [...t.text.replace(/\s+/g, '')].map((c) => PUNCT_PINYIN[c] ?? c).join('');
      } else {
        out += ' ' + t.text;
      }
    }
    return out.trim();
  }

  /** Word-by-word Arabic gloss in Chinese order (the "ترجمة حرفية"). */
  function literalGloss(words) {
    return arr(words).map((w) => w.mean || '…').join(' / ');
  }

  // ───────────── Grammar roles ─────────────

  /** Colour groups, keyed by the Chinese component name Claude returns in role_zh. */
  const ROLE_GROUPS = [
    { key: 'subj', zh: '主语', ar: 'مبتدأ' },
    { key: 'pred', zh: '谓语', ar: 'خبر' },
    { key: 'obj', zh: '宾语', ar: 'مفعول به' },
    { key: 'attr', zh: '定语', ar: 'صفة / مضاف إليه' },
    { key: 'adv', zh: '状语', ar: 'حال / ظرف' },
    { key: 'comp', zh: '补语', ar: 'مكمّل' },
    { key: 'pivot', zh: '兼语', ar: 'مفعول به وفاعل' },
    { key: 'link', zh: '关联词', ar: 'أداة ربط' },
    { key: 'part', zh: '助词', ar: 'أداة' },
    { key: 'other', zh: '独立语', ar: 'جملة اعتراضية' },
  ];
  const ROLE_ZH = ROLE_GROUPS.map((g) => g.zh);

  function canonicalRoleZh(z) {
    z = str(z);
    if (ROLE_ZH.includes(z)) return z;
    return ROLE_ZH.find((r) => z.includes(r)) || '';
  }

  /** role_zh → group key ('subj' … 'other'); unknown roles fall into 'other'. */
  function roleGroup(roleZh) {
    const zh = canonicalRoleZh(roleZh);
    const g = ROLE_GROUPS.find((x) => x.zh === zh);
    return g ? g.key : 'other';
  }

  // ───────────── Normalizers ─────────────

  function normalizeWord(w) {
    w = w || {};
    return {
      w: stripPunct(w.w ?? w.word ?? w.hanzi),
      py: str(w.py ?? w.pinyin),
      pos: str(w.pos),
      pos_zh: str(w.pos_zh),
      role: str(w.role),
      role_zh: canonicalRoleZh(w.role_zh) || str(w.role_zh),
      irab: str(w.irab),
      mean: str(w.mean ?? w.meaning),
    };
  }

  function normalizePattern(p) {
    p = p || {};
    return {
      zh: str(p.zh),
      py: str(p.py),
      ar: str(p.ar),
      explain_ar: str(p.explain_ar),
      example_zh: str(p.example_zh),
      example_ar: str(p.example_ar),
      emphasized: p.emphasized === true || p.emphasized === 'true',
    };
  }

  function normalizeAnalysis(r) {
    r = r || {};
    return {
      words: arr(r.words).map(normalizeWord).filter((w) => w.w),
      parts: arr(r.parts)
        .map((p) => ({
          text: stripPunct(p && p.text),
          role: str(p && p.role),
          role_zh: canonicalRoleZh(p && p.role_zh) || str(p && p.role_zh),
        }))
        .filter((p) => p.text),
      structure_ar: str(r.structure_ar),
      translation_ar: str(r.translation_ar),
      patterns: arr(r.patterns).map(normalizePattern).filter((p) => p.zh),
      notes_ar: arr(r.notes_ar).map(str).filter(Boolean),
    };
  }

  /** Checks an analysis against its printed sentence. → [{ kind, msg_ar }] */
  function checkAnalysis(sentence, a) {
    const issues = [];
    const target = stripPunct(sentence.text);
    if (!a.words.length) {
      issues.push({ kind: 'words', msg_ar: 'لم تصل كلمات هذه الجملة.' });
    } else if (a.words.map((w) => w.w).join('') !== target) {
      issues.push({ kind: 'words', msg_ar: 'تقطيع الكلمات لا يطابق نص الجملة حرفًا بحرف. راجعه أو اضغط «دقّق».' });
    }
    if (a.parts.length && a.parts.map((p) => p.text).join('') !== target) {
      issues.push({ kind: 'parts', msg_ar: 'أجزاء التركيب لا تغطي الجملة كاملة.' });
    }
    if (!a.translation_ar) issues.push({ kind: 'translation', msg_ar: 'الترجمة ناقصة لهذه الجملة.' });
    if (a.words.some((w) => !w.py)) issues.push({ kind: 'pinyin', msg_ar: 'بعض الكلمات بلا نطق.' });
    return issues;
  }

  /**
   * Claude's reply for one chunk → { analyses: { S1: analysis, … }, warnings: [{ id, kind, msg_ar }] }.
   * chunkSentences: the sentence objects of the chunk (from buildDocument).
   * A sentence with no usable reply is left out of analyses and gets a warning of kind 'missing'.
   */
  function normalizeChunk(raw, chunkSentences) {
    const list = Array.isArray(raw) ? raw : arr(raw && raw.sentences);
    const byId = new Map(list.filter((s) => s && s.id).map((s) => [str(s.id).toUpperCase(), s]));
    const analyses = {};
    const warnings = [];
    chunkSentences.forEach((sentence, i) => {
      const r = byId.get(sentence.id.toUpperCase()) || (byId.size === 0 ? list[i] : undefined);
      if (!r) {
        warnings.push({ id: sentence.id, kind: 'missing', msg_ar: 'لم يصل تحليل هذه الجملة. اضغط «أعد التحليل».' });
        return;
      }
      const a = normalizeAnalysis(r);
      analyses[sentence.id] = a;
      checkAnalysis(sentence, a).forEach((w) => warnings.push({ id: sentence.id, ...w }));
    });
    return { analyses, warnings };
  }

  /** Review reply → { analyses, warnings, changes_ar }. */
  function normalizeReview(raw, chunkSentences) {
    const out = normalizeChunk(raw, chunkSentences);
    out.changes_ar = arr(raw && raw.changes_ar).map(str).filter(Boolean);
    return out;
  }

  function normalizeOverview(raw) {
    raw = raw || {};
    return {
      title_ar: str(raw.title_ar),
      genre_ar: str(raw.genre_ar),
      main_idea_ar: str(raw.main_idea_ar),
      purpose_ar: str(raw.purpose_ar),
      paragraphs: arr(raw.paragraphs)
        .map((p) => ({ n: Number(p && p.n) || 0, idea_ar: str(p && p.idea_ar) }))
        .filter((p) => p.idea_ar),
      glossary: arr(raw.glossary)
        .map((g) => ({ zh: str(g && g.zh), py: str(g && g.py), ar: str(g && g.ar), note_ar: str(g && g.note_ar) }))
        .filter((g) => g.zh && g.ar),
      tips_ar: arr(raw.tips_ar).map(str).filter(Boolean),
    };
  }

  /** One OCR page → { title, paragraphs, uncertain, notes_ar }. Paragraphs keep **bold** markers. */
  function normalizeOcr(raw) {
    raw = raw || {};
    return {
      title: str(raw.title),
      paragraphs: arr(raw.paragraphs).map(str).filter((p) => stripPunct(p.replace(/\*\*/g, ''))),
      uncertain: arr(raw.uncertain)
        .map((u) => ({ text: str(u && u.text), context: str(u && u.context), reason_ar: str(u && u.reason_ar) }))
        .filter((u) => u.text),
      notes_ar: str(raw.notes_ar),
    };
  }

  /** Several OCR pages (in order) → one { title, paragraphs, uncertain, notes_ar }. */
  function mergeOcrPages(pages) {
    const out = { title: '', paragraphs: [], uncertain: [], notes_ar: [] };
    pages.forEach((p, i) => {
      if (p.title && !out.title) out.title = p.title;
      else if (p.title) out.paragraphs.push(p.title);
      out.paragraphs.push(...p.paragraphs);
      out.uncertain.push(...p.uncertain.map((u) => ({ ...u, page: i + 1 })));
      if (p.notes_ar) out.notes_ar.push(pages.length > 1 ? `صفحة ${i + 1}: ${p.notes_ar}` : p.notes_ar);
    });
    return out;
  }

  const ERROR_TYPES = ['معنى', 'حذف', 'إضافة', 'اسم علم/مصطلح', 'زمن/نفي', 'نحو وإملاء', 'أسلوب'];

  function normalizeGrade(raw) {
    raw = raw || {};
    let score = Number(raw.score);
    if (!Number.isFinite(score)) score = 0;
    score = Math.round(Math.min(10, Math.max(0, score)) * 4) / 4;
    return {
      score,
      verdict_ar: str(raw.verdict_ar),
      errors: arr(raw.errors)
        .map((e) => ({
          type: ERROR_TYPES.find((t) => str(e && e.type).includes(t.split('/')[0])) || str(e && e.type) || 'معنى',
          student: str(e && e.student),
          fix: str(e && e.fix),
          why_ar: str(e && e.why_ar),
        }))
        .filter((e) => e.student || e.fix || e.why_ar),
      corrected_ar: str(raw.corrected_ar),
      model_ar: str(raw.model_ar),
    };
  }

  // ───────────── Prompts ─────────────

  const COURSE_AR = { translation: 'الترجمة', article: 'المقال' };

  /** doc: { title, paragraphs } with clean strings (buildDocument output or a stored text). */
  function passage(doc) {
    const lines = [];
    if (doc.title) lines.push('TITLE: ' + doc.title);
    arr(doc.paragraphs).forEach((p, i) => lines.push(`[${i + 1}] ${p}`));
    return lines.join('\n');
  }

  function glossaryBlock(glossary) {
    const lines = arr(glossary)
      .filter((g) => g.zh && g.ar)
      .map((g) => `${g.zh} → ${g.ar}`);
    return lines.length ? lines.join('\n') : '(none yet — use established Arabic names)';
  }

  function sentenceList(sentences) {
    return sentences
      .map((s) => `${s.id}: ${s.text}\n    EMPHASIZED in the handout: ${s.bold && s.bold.length ? s.bold.join(' ، ') : 'none'}`)
      .join('\n');
  }

  function persona(course) {
    return `You are a meticulous teacher of Chinese–Arabic translation at an Egyptian university (Faculty of Al-Alsun style). Your student is a native Arabic speaker preparing for the course «${COURSE_AR[course] || COURSE_AR.translation}». In the exam they get a Chinese text and must read it (pinyin), parse every word using Arabic grammar terms (إعراب), and translate it into Arabic with zero mistakes — every error costs marks. The student memorizes what you produce, so accuracy matters more than anything else. Check your work carefully before answering.`;
  }

  const RULES = `FIELDS FOR EACH SENTENCE

"words" — the sentence split into dictionary words (词), in order. Each word is
  {"w": the characters exactly as printed, "py": pinyin,
   "pos": Arabic part of speech, "pos_zh": Chinese part of speech,
   "role": Arabic i'rab term, "role_zh": Chinese sentence component,
   "irab": one short Arabic i'rab line, "mean": Arabic meaning in this context}

SEGMENTATION
- Split as a good Chinese dictionary would (办事 / 方式; 规章制度 stays one word). Real 成语 — four-character idioms listed in a 成语 dictionary (不可估量, 伤痕累累, 草草了事) — stay one word with pos_zh 成语. Other phrases are split into their words, and pos_zh 成语 is never used for them (发自内心 is 发自 / 内心; 终身大事 is 终身 / 大事).
- An adverb and the verb after it are two words (就 / 像, 都 / 是); 这/那/哪 and a following measure word are two words (这 / 种, 那 / 种). Split the same string the same way every time it appears in the text.
- Separate words: the particles 的 地 得 了 着 过 所 吗 呢 吧; the negators 不 没 别 (but keep lexicalized words whole: 不论, 不要, 不过, 不但); a numeral and its measure word (一 / 份); a verb and a following 了.
- Keep 们 attached (朋友们). Keep proper nouns and titles whole, without 《》 (金字塔报).
- No punctuation inside words. Never correct the printed text, even an obvious typo: analyze what is printed and give the likely intended word in notes_ar.

PINYIN ("py")
- Tone marks (ā á ǎ à, ǖ ǘ ǚ ǜ), never tone numbers. Syllables of one word written together (jīntiān, bànshì); a four-character expression in two halves (bùkě gūliàng).
- Neutral tone unmarked (de, le, zhe, men, xǐhuan). Proper nouns capitalized and written by Hanyu Pinyin orthography, proper part and generic part apart (Zhōngguó, Āijí, Jīnzìtǎ Bào, Běijīng Shì).
- 一 and 不 take the tone actually spoken, as Chinese textbooks mark it (bú shì, bú yào, yí gè, yìqǐ, yídìng); every other character keeps its dictionary tone (do not mark third-tone sandhi).
- Polyphonic characters: pick the reading that fits the context — 地 de/dì, 得 de/dé/děi, 了 le/liǎo, 着 zhe/zháo/zhuó, 为 wèi/wéi, 都 dōu/dū, 长 cháng/zhǎng, 行 xíng/háng, 重 zhòng/chóng, 还 hái/huán, 只 zhǐ/zhī, 种 zhǒng/zhòng, 处 chù/chǔ, 好 hǎo/hào, 要 yào/yāo, 分 fēn/fèn, 当 dāng/dàng, 将 jiāng/jiàng, 相 xiāng/xiàng, 觉 jué/jiào, 发 fā/fà, 便 biàn/pián, 数 shù/shǔ, 调 diào/tiáo, 传 chuán/zhuàn, 结 jié/jiē, 量 liàng/liáng, 少 shǎo/shào, 似 sì/shì. When the choice is a classic trap, add a note in notes_ar.

PARTS OF SPEECH
- "pos" (Arabic), one of: اسم، مصدر، اسم علم، ضمير، اسم إشارة، فعل، فعل مساعد، صفة، ظرف، أداة نفي، حرف جر، أداة ربط، أداة، عدد، كلمة قياس، اسم زمان، اسم مكان، تعبير اصطلاحي. Describe the word as it functions in THIS sentence: a verb used as a noun (表达了…关注 → 关注) is «مصدر».
- "pos_zh" (Chinese), one of: 名词、专有名词、代词、指示代词、动词、能愿动词、形容词、副词、介词、连词、助词、数词、量词、时间名词、方位名词、成语 — the dictionary class (关注 stays 动词 even when its pos is «مصدر»).

I'RAB — the Arabic grammar terms this class uses
"role_zh" must be exactly one of: 主语 谓语 宾语 定语 状语 补语 兼语 关联词 助词 独立语
"role" is the Arabic term the student writes (a short qualifier in parentheses is fine):
- 主语 → «مبتدأ». Arabic reads «我分享…» like «أنا أشاركُ…»: the subject is the مبتدأ and the verb clause is its خبر.
- 谓语 → «خبر»: «خبر (فعل)» for the main verb, «خبر (صفة)» for an adjective predicate, «خبر (فعل الكينونة)» for 是. A second verb phrase sharing the same subject (连谓: 写了…，谈到了…; 带着…) → «خبر ثانٍ (فعل)»; if your translation renders it as a حال (حاملًا), say so in irab. Auxiliary verbs (能、会、要、必须、可以、应该、能够) → «فعل مساعد» with role_zh 状语.
- 去/来 before another verb (去工作، 不要去做، 去帮他، 来看) means setting out to do it, not physical movement: 去/来 is «خبر (فعل)» with "mean" «[الإقدام على الفعل]», and the verb after it is «خبر ثانٍ (فعل)» (连谓) — never «مفعول به». 去/来 means "go/come" only when a place follows or is implied (去北京).
- 宾语 → «مفعول به» (the object of a verb). Exception: the noun, pronoun or phrase after 是 is «خبر الكينونة» (role_zh 宾语), never «مفعول به». The object of a preposition (在、对、给、跟、与、向、为了、关于、把、被、从) → «اسم مجرور», role_zh of the prepositional phrase: 状语, or 定语 when it modifies a noun (关于中东的文章).
- 把 + N + verb: N is «اسم مجرور» (role_zh 状语); its irab says it is the verb's object moved before it, e.g. «اسم مجرور بـ«把»، وهو في المعنى مفعول به للفعل «当成» تقدّم عليه». The 把-phrase is «شبه جملة (جار ومجرور) متعلق بالفعل», never «حال».
- 定语 → «صفة» for a descriptive modifier; «مضاف إليه» for a possessor (我的، 学生的، 中国的 meaning "China's"); numerals «عدد»; measure words «كلمة قياس»; 这/那 «اسم إشارة».
- 状语 → «حال» (manner: 自发地، 全面), «ظرف زمان» (今天، 昨晚، 已经، 将来), «ظرف مكان», «ظرف» (degree, scope, frequency: 很، 最، 都، 也، 就، 才، 始终), «أداة نفي» (不، 没、别), «حرف جر» for the preposition itself. In 在……中/上/里/下 the noun is «اسم مجرور» and 中/上/里/下 is «اسم مكان (يكمل حرف الجر)», all with role_zh 状语.
- 补语 → «مكمّل» with its type: (نتيجة 结果) only for a verb or adjective attached straight to the verb with no 得 (做完، 看懂); (حال/درجة 情态/程度) for what follows 得 (累得身心疲惫، 说得很好); (اتجاه 趋向), (إمكان 可能), (مدة/عدد 时量/动量). The role and the irab name the same type.
- 兼语 → «مفعول به وفاعل» — the noun after 让/叫/使/请/托/派/要求/鼓励/劝 that is the object of that verb and the subject of the next one. The verb after it is «خبر (فعل) لـ«N»» (N = that noun), role_zh 谓语 — not «خبر ثانٍ», which is only for verbs sharing the sentence's own subject.

Give each word the role it has inside the smallest clause that contains it; when that clause is itself part of a bigger one (an object clause, a 的-clause before a noun), say so in "irab".
"irab": one short Arabic line in the style of an Arabic-grammar teacher — the word's type, its role, and what it attaches to, at most 22 words. E.g. «اسم، مفعول به للفعل «分享»» or «ضمير، مبتدأ لجملة «我认为是最有效的» الواقعة صفة لـ«方式»». No case-ending talk (مرفوع/منصوب).

"parts" — the sentence's main components in order, the way a teacher brackets them on the board: [{"text": contiguous characters of the sentence, "role": Arabic term, "role_zh": Chinese component}]. Their texts joined must equal the sentence without punctuation. Group modifiers with their head (中国菜 is one part «مفعول به (مركب وصفي)»; 跟大家 is one part «شبه جملة (جار ومجرور)» with role_zh 状语). For a complex sentence (复句) list each clause's parts in order, with each connector as its own part («أداة ربط», 关联词). A long object or attribute clause may stay one part.
"structure_ar" — the main structure as a one-line Arabic formula, e.g. «ظرف زمان + مبتدأ + جار ومجرور + فعل (خبر) + مفعول به»; for a complex sentence also name how the clauses relate (شرط، سبب ونتيجة، استدراك، تتابع…).

TRANSLATION
"translation_ar" — the exam answer: faithful first, then fluent formal Arabic (فصحى).
- Render every element: subject, tense and aspect (verb + 了 completed → usually past; sentence-final 了 → a change of state, rendered with «صار/أصبح/عندئذٍ» in whatever tense the context needs; 已经 → «قد» + past; 将/将来 → «سـ/سوف» or «في المستقبل»; 正在 → ongoing present), negation and its scope, degree words (很، 最، 绝对، 始终، 千万), numbers and quantities, every modifier.
- Negation: 不 negates the present, habits, wishes and the future → «لا» / «لن» (a past habit or state: «لم يكن + مضارع»); 没/没有 negates an action that did not happen → «لم». Never translate 不 as «لم» + past.

- With no aspect marker, take the tense from the context (a news report narrates in the past; 写道 → «كتب»).

- Measure words and particles are expressed through Arabic structure, not translated as separate words.
"mean" (per word) — the meaning in THIS context, 1–4 Arabic words, in the form used in your translation_ar (实现 → «تحقيق» if the translation says «تحقيق السلام»); for a particle give its function in brackets, e.g. «[أداة الإتمام]», «[أداة الإضافة]». Joined in order, the "mean" values form the student's word-by-word gloss.

"patterns" — grammar patterns and connectors in this sentence the student must learn: paired connectors (不论…都…، 只有…才…، 因为…而…), 被 and 被…所…, 把, 是…的, 在…下, 让/使 + verb, comparisons, verb–complement constructions, set phrases. Each: {"zh": the pattern with …… for the gaps, "py": its pinyin, "ar": Arabic equivalent(s), "explain_ar": how it works in 1–2 sentences, "example_zh": a NEW short example sentence (not from the text), "example_ar": its Arabic translation, "emphasized": true if it matches handout-emphasized text}. Empty array if none.
"notes_ar" — 0–4 short Arabic notes on traps: polyphones, a word whose usual dictionary meaning is wrong here, a likely typo in the source, a translation choice. Empty array if nothing important.
- Only state what you are sure of. Call the source a typo only when the printed form is not a real word or makes the sentence ungrammatical — a rarer but correct word (托 = يُوكِل) is not a typo. Never call a printed word redundant (زائدة) when the sentence reads correctly with it (不是因为… = «ليس لأن…»). No general claims about Arabic grammar you cannot back (Arabic needs no linking word between مبتدأ and خبر).`;

Reply with only this JSON, no markdown fences:

  "main_idea_ar": "يعرض النص مقالًا كتبه صحفي في صحيفة «الأهرام» عن زيارة وزير الخارجية الصيني لمصر حاملًا رسالة من الرئيس الصيني إلى الرئيس المصري. وتعبّر الرسالة عن اهتمام الرئيس الصيني البالغ بقضية السلام في الشرق الأوسط، ويختم النص بأن الشعب العربي يتوق إلى السلام ويمكنه تحقيقه والحفاظ عليه.",
  "purpose_ar": "يهدف الكاتب إلى إبراز اهتمام الصين بقضية السلام في الشرق الأوسط وتأييدها لتطلع الشعب العربي إلى السلام.",
  "paragraphs": [

    "n": 1,
    "idea_ar": "صحفي في «الأهرام» يكتب مقالًا عن الشرق الأوسط يتناول فيه زيارة وزير الخارجية الصيني لمصر."
   },
   {
    "n": 2,
    "idea_ar": "وصل وزير الخارجية الصيني إلى مصر حاملًا رسالة من الرئيس الصيني يتناول فيها الوضع في الشرق الأوسط ويعبّر عن اهتمامه البالغ بالسلام في المنطقة."
   },
   {
    "n": 3,
    "idea_ar": "درس الرئيس الصيني قضية الشرق الأوسط مع قادة الدول الأخرى ونقل وزير الخارجية رأي الرئيس الصيني إلى الرئيس المصري، والشعب العربي يتوق إلى السلام ويمكنه تحقيقه والحفاظ عليه."
   }
  ],

   "«金字塔报» هي صحيفة «الأهرام»؛ الترجمة الحرفية «صحيفة الهرم» خطأ في اسم علم.",
   "«中国主席» و«中国国家主席» كلاهما «الرئيس الصيني»، و«埃及总统» «الرئيس المصري»، و«外交部长» «وزير الخارجية».",
   "الزمن: «了» بعد 写/谈到/表达/研究 ← ماضٍ، و«已经…了» ← «قد/لقد» + ماضٍ، و«将来» ← «في المستقبل»، و«昨晚» ← «مساء أمس».",

   "النطق: «部长» bùzhǎng، و«一» تتغير نبرتها: yí wèi، yì piān، yí fèn، zhè yí dìqū.",
   "«他» في «他对这一问题的看法» يعود على الرئيس الصيني لا على وزير الخارجية."
  ]

/** Serialises writes per key (latest wins), debounces if asked, tracks saving / failed state for the UI. */
const Saver = (() => {
  const writers = new Map();

const TOK = new WeakMap();
function tokensFor(s, a) {
  if (!a) return null;

  const al = C.alignWords(s.text, a.words);
  const emph = new Set();
  al.tokens.forEach((t) => {
    if (t.type === 'word' && (s.boldRanges || []).some(([x, y]) => t.start < y && t.end > x)) emph.add(t.index);
  });
  r = { tokens: al.tokens, ok: al.ok, emph, text: s.text };
  TOK.set(a, r);
  return r;
}
const analysisOf = (t, sid) => (t.analyses && t.analyses[sid]) || null;

function sentLabels(t) {
  const out = {}; let ord = 0;
  t.doc.sentences.forEach((s) => {
    if (s.para === 0) out[s.id] = { short: 'العنوان', ord: 0, text: 'العنوان' };
    else { ord++; out[s.id] = { short: 'الجملة ' + ord, ord, text: `الجملة ${ord} · الفقرة ${s.para}` }; }
  });
  return out;
}

/** Word instances in sentence order. n = running number (null after the first unfinished sentence). */
function instances(t) {
  const out = []; let n = 0; let blocked = false;
  t.doc.sentences.forEach((s) => {
    const a = analysisOf(t, s.id);
    if (!a) { blocked = true; return; }
    const tk = tokensFor(s, a);
    a.words.forEach((w, i) => {
      out.push({ tid: t.id, sid: s.id, i, w, para: s.para, emph: tk.emph.has(i), n: blocked ? null : ++n });
    });
  });
  return out;
}
function numberStarts(t) {
  const starts = {}; let n = 0; let blocked = false;
  t.doc.sentences.forEach((s) => {
    const a = analysisOf(t, s.id);
    if (!a) { blocked = true; return; }
    if (!blocked) { starts[s.id] = n + 1; n += a.words.length; }
  });
  return starts;
}
function uniqueWords(list) {
  const m = new Map();
  list.forEach((t) => instances(t).forEach((x) => {
    const e = m.get(x.w.w);
    if (!e) m.set(x.w.w, { w: x.w.w, first: x, occ: [x] }); else e.occ.push(x);
  }));
  return m;
}
const isLoaded = (t) => t.isSample || S.loaded.has(t.id);
const textStats = (t) => {
  if (!isLoaded(t)) { const st = t.stats || {}; return { words: st.words == null ? null : st.words, fresh: st.newWordsHint == null ? null : st.newWordsHint, hint: true }; }
  const inst = instances(t); const uni = new Set(inst.map((x) => x.w.w));
  let fresh = 0; uni.forEach((w) => { if (!S.known.has(w)) fresh++; });
  return { words: inst.length, fresh };
};
function chunkProgress(t) {
  const cs = t.chunkState || {}; const total = t.doc.chunks.length;
  let done = 0; let running = 0; let err = 0;
  t.doc.chunks.forEach((c) => { const s = (cs[c.id] || {}).status; if (s === 'done') done++; else if (s === 'running') running++; else if (s === 'error') err++; });
  return { total, done, running, err, pending: total - done - running - err };
}
const isRunning = (t) => !t.isSample && (t.overviewStatus === 'running' || chunkProgress(t).running > 0);
function statusOf(t) {
  if (t.isSample) return 'ready';
  const p = chunkProgress(t);
  if (isRunning(t)) return 'running';
  return p.done === p.total && t.overviewStatus === 'done' ? 'ready' : 'partial';
}
const needsResume = (t) => !t.isSample && !isRunning(t) && (chunkProgress(t).done < t.doc.chunks.length || t.overviewStatus !== 'done');

function chunkSentences(t, c) { const set = new Set(c.sentenceIds); return t.doc.sentences.filter((s) => set.has(s.id)); }
const chunkOf = (t, sid) => t.doc.chunks.find((c) => c.sentenceIds.includes(sid));

function translationOf(t, sentences) {

    a.patterns.forEach((p) => {

function newTextRecord(course, title, paragraphs) {

    doc, overview: null, overviewStatus: 'pending', overviewError: '', chunkState: {}, analyses: {}, promptVersion: C.PROMPT_VERSION,
  };

}
function ensureChunkState(t) {

  t.doc.chunks.forEach((c) => {
    const cs = t.chunkState[c.id] || (t.chunkState[c.id] = { status: 'pending', error: '', warnings: [], changes_ar: [], reviewedAt: 0 });
    if (cs.status === 'running' && !S.live.has(t.id + ':' + c.id)) cs.status = 'pending';

async function runOverview(t, signal) {

async function runChunk(t, id, { force = false, signal } = {}) {
  const key = t.id + ':' + id; const cs = t.chunkState[id]; const chunk = t.doc.chunks.find((c) => c.id === id);
  S.live.add(key);
  try {
    if (signal.aborted) throw cancelled();
    const sentences = chunkSentences(t, chunk);
    const prompt = C.analyzePromptParts({ doc: t.doc, course: t.course, glossary: t.overview && t.overview.glossary, sentences });
    S.live.add(key + ':call');
    const opts = { task: 'analyze', tier: tierOf(), signal, fresh: !!force, tag: 'analyze:' + id };
    let res = C.normalizeChunk(await AI.json(prompt, opts), sentences);
    // A reply that fails the checks (words that don't rebuild the sentence, a missing
    // translation…) is redone once; the better of the two is kept.
    if (res.warnings.length && !signal.aborted) {
      try {
        const again = C.normalizeChunk(await AI.json(prompt, Object.assign({}, opts, { fresh: true })), sentences);
        if (again.warnings.length < res.warnings.length) res = again;
      } catch (e) { /* keep the first reply */ }
    }
    if (!Object.keys(res.analyses).length) throw { code: 'invalid_json', message: 'empty' };
    Object.assign(t.analyses, res.analyses);
    cs.status = 'done'; cs.error = ''; cs.warnings = res.warnings;
    cs.reviewedAt = 0; cs.reviewedBy = ''; cs.changes_ar = []; // a new analysis has not been reviewed
    saveChunkDoc(t, id, res.analyses);
  } catch (e) {
    if (isCancel(e)) { cs.status = 'pending'; cs.error = ''; } else { cs.status = 'error'; cs.error = errMsg(e); }
  } finally { S.live.delete(key); S.live.delete(key + ':call'); }
  persistMeta(t); rr();
}

async function startAnalysis(t) {

  const ctrl = ctrlOf(t); ensureChunkState(t);
  const ids = t.doc.chunks.map((c) => c.id).filter((id) => t.chunkState[id].status !== 'done');
  const needOv = t.overviewStatus !== 'done';
  ids.forEach((id) => { const cs = t.chunkState[id]; cs.status = 'running'; cs.error = ''; S.live.add(t.id + ':' + id); });
  if (needOv) { t.overviewStatus = 'running'; t.overviewError = ''; }
  persistMeta(t); rr();
  if (needOv) await runOverview(t, ctrl.signal);

// ───────────── image prep (rotate + downscale via canvas) ─────────────
async function loadBitmap(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => { URL.revokeObjectURL(url); rej({ code: 'image_rejected', message: 'bad image' }); };
      img.src = url;
    });
  }
}
async function prepImage(photo, maxBytes) {
  const bmp = await loadBitmap(photo.file);
  const w0 = bmp.width || bmp.naturalWidth; const h0 = bmp.height || bmp.naturalHeight;
  let scale = Math.min(1, 2400 / Math.max(w0, h0)); let q = 0.92; let blob = null;
  for (let k = 0; k < 5; k++) {
    const w = Math.max(1, Math.round(w0 * scale)); const h = Math.max(1, Math.round(h0 * scale));
    const quarter = photo.rot % 180 !== 0;
    const cv = document.createElement('canvas'); cv.width = quarter ? h : w; cv.height = quarter ? w : h;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.translate(cv.width / 2, cv.height / 2); ctx.rotate((photo.rot * Math.PI) / 180);
    ctx.drawImage(bmp, -w / 2, -h / 2, w, h);
    blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', q));
    if (!blob) throw { code: 'image_rejected', message: 'encode failed' };
    if (!maxBytes || blob.size <= maxBytes) break;
    scale *= 0.8; q = 0.85;
  }
  return blob;
}

async function runOcr() {
  const nt = S.nt; const photos = nt.photos; const n = photos.length;
  nt.ctrl = new AbortController(); nt.ocr = { running: true, i: 0, n, error: '' }; rr();
  const maxBytes = (AI.limits().images || {}).maxInputBytes;
  for (let i = 0; i < n; i++) {
    const p = photos[i];
    if (nt.pages[p.id] && nt.pages[p.id].rot === p.rot) continue;
    nt.ocr.i = i; rr();
    try {
      const blob = await prepImage(p, maxBytes);
      const raw = await AI.json(C.ocrPrompt({ page: i + 1, pages: n }), { task: 'ocr', tier: tierOf(), images: [blob], signal: nt.ctrl.signal, priority: true, tag: `ocr:${i + 1}/${n}` });
      nt.pages[p.id] = Object.assign(C.normalizeOcr(raw), { rot: p.rot });
    } catch (e) {
      nt.ocr = { running: false, i, n, error: isCancel(e) ? '' : errMsg(e) }; rr(); return;
    }
  }
  const merged = C.mergeOcrPages(photos.map((p) => nt.pages[p.id]));
  nt.ocr = null; nt.step = 'review';
  nt.edTitle = merged.title; nt.edBody = merged.paragraphs.join('\n');
  nt.uncertain = merged.uncertain; nt.notes = merged.notes_ar.join(' ');
  saveDraft(); rr();
}

function rubyTokens(t, s, a, o = {}) {

    const n = starts[s.id] ? starts[s.id] + tok.index : null;

function boldPreview(text, doubts) {
  const ds = (doubts || []).map((u) => u && u.text).filter(Boolean); const used = new Set();
  const plain = (p) => {
    let h = esc(p);
    ds.forEach((d) => {
      if (used.has(d)) return;
      const e = esc(d); const i = h.indexOf(e);
      if (i >= 0) { used.add(d); h = h.slice(0, i) + `<span class="doubt">${e}</span>` + h.slice(i + e.length); }
    });

  };
  return String(text || '').split('\n').filter((l) => l.trim()).map((l) => {
    const parts = l.split('**'); const unb = parts.length % 2 === 0;
    return '<p>' + parts.map((p, i) => (i % 2 === 1 && !(unb && i === parts.length - 1) ? `<mark>${esc(p)}</mark>` : plain(p))).join('') + '</p>';
  }).join('');
}

function tabSent(t) {

function sentCard(t, s, lab, starts, idx, n) {
  const a = analysisOf(t, s.id); const chunk = chunkOf(t, s.id); const cs = (t.chunkState[chunk.id]) || {};
  const tot = t.doc.sentences.filter((x) => x.para > 0).length;
  const text = s.para === 0 ? 'العنوان' : `الجملة ${lab.ord} من ${tot} · الفقرة ${s.para}`;
  const pager = `<div class="pager"><span class="sc-label">${text}</span><span class="btns"><button class="ibtn" id="sent-prev" data-act="sentNav" data-id="${t.id}" data-d="-1" aria-label="الجملة السابقة" ${idx <= 0 ? 'disabled' : ''}>${ICON.back}</button><button class="ibtn" id="sent-next" data-act="sentNav" data-id="${t.id}" data-d="1" aria-label="الجملة التالية" ${idx >= n - 1 ? 'disabled' : ''}>${ICON.next}</button></span></div>`;
  if (!a) {
    let st;
    if (cs.status === 'running') st = '<div class="skel" aria-busy="true"><i></i><i></i><span>جاري التحليل…</span></div>';
    else if (cs.status === 'error') st = `<p class="err" role="alert">${esc(cs.error)}</p>${claudeOnly(`<button class="btn sm" id="retry-${chunk.id}" data-act="retryChunk" data-id="${t.id}" data-c="${chunk.id}">${ICON.retry}<span>أعد المحاولة</span></button>`)}`;
    else st = '<p class="muted">لم يُحلَّل بعد.</p>';
    return `<article class="card sent" id="sc-${s.id}"><section class="sect">${pager}${plainLine(s)}${st}</section></article>`;
  }
  const tk = tokensFor(s, a); const key = t.id + ':' + chunk.id;
  const warns = (cs.warnings || []).filter((w) => w.id === s.id).map((w) => `<p class="warn-note">${esc(w.msg_ar)}</p>`).join('');
  const parts = a.parts.length ? `<div class="parts" dir="ltr">${a.parts.map((p, i) => `<div class="part ${gcls(C.roleGroup(p.role_zh))}${i === a.parts.length - 1 && [...p.text].length > 6 ? ' wide' : ''}"><span class="p-zh" lang="zh-CN">${esc(p.text)}</span><span class="p-ar" dir="rtl">${esc(p.role || p.role_zh)}</span></div>`).join('')}</div>` : '';
  const LIM = 8; const rk = t.id + ':' + s.id; const open = !!(S.ui.rowsOpen && S.ui.rowsOpen[rk]);
  const rows = a.words.map((w, i) => {
    if (!open && i >= LIM) return '';
    const g = C.roleGroup(w.role_zh); const part = g === 'part'; const num = starts[s.id] ? starts[s.id] + i : '';
    return `<li class="ir ${gcls(g)}"><div class="ir-l"><div class="ir-top"><span class="ir-n">${num}</span><button class="ir-w" lang="zh-CN" dir="ltr" data-act="word" ${dataW(t.id, s.id, i)}><span>${esc(w.w)}</span></button></div><span class="ir-py" dir="ltr">${esc(w.py)}</span></div><div class="ir-b"><div class="ir-h">${roleChip(w)}${part ? '' : `<span class="ir-m">${esc(w.mean)}</span>`}</div>${part ? '' : `<p class="ir-t">${esc(w.irab)}</p>`}</div></li>`;
  }).join('');
  const more = !open && a.words.length > LIM ? `<button class="more-btn" id="more-${s.id}" data-act="moreRows" data-k="${rk}"><span>عرض الكلمات الـ${a.words.length - LIM} الباقية</span>${ICON.chev}</button>` : '';
  const pats = a.patterns.length ? `<section class="sect"><h3>تراكيب مهمة</h3>${a.patterns.map(patternHtml).join('')}</section>` : '';
  const notes = a.notes_ar.length || warns ? `<section class="sect"><h3>ملاحظات</h3><ul class="dots">${a.notes_ar.map((x) => `<li><span>${esc(x)}</span></li>`).join('')}</ul>${warns}</section>` : '';
  const changes = (cs.changes_ar || []).filter((c) => !/\bS\d+\b/.test(c) || new RegExp('\\b' + s.id + '\\b').test(c));
  const reviewed = cs.reviewedAt ? `<div class="reviewed"><b>${ICON.check} تم التدقيق${cs.reviewedBy ? ` (${esc(cs.reviewedBy)})` : ''}</b>${changes.length ? `<ul class="plain">${changes.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>` : ' — لا أخطاء'}</div>`
    : cs.status === 'done' && !t.isSample ? `<p class="reviewed todo">تحليل أوّلي — لم يُدقَّق بعد.</p>` : '';
  const rerr = S.reviewErr[key] ? `<p class="err" role="alert">${esc(S.reviewErr[key])}</p>` : '';
  const busy = S.reviewing.has(key); const run = cs.status === 'running';

function buildQuiz(scope) {
  const list = scope === 'all' ? allTexts() : [getText(scope)].filter(Boolean);
  const cand = shuffle(list.flatMap((t) => instances(t).filter((x) => QUIZ_GROUPS.includes(C.roleGroup(x.w.role_zh)))));
  const seen = new Set(); const pick = [];
  cand.forEach((x) => { if (pick.length < 10 && !seen.has(x.w.w)) { seen.add(x.w.w); pick.push(x); } });
  cand.forEach((x) => { if (pick.length < 10 && !pick.includes(x)) pick.push(x); });
  const qs = pick.map((x) => {
    const g = C.roleGroup(x.w.role_zh);
    return { tid: x.tid, sid: x.sid, i: x.i, group: g, options: shuffle([g, ...shuffle(QUIZ_GROUPS.filter((k) => k !== g)).slice(0, 3)]) };
  });
  S.quiz = { scope, qs, i: 0, picked: null, score: 0 };
}

// ───────────── flashcards (Leitner) ─────────────
const BOX_DAYS = [0, 0, 1, 3, 7, 16];
function buildSession(filter) {
  const entries = deckEntries(filter || null); const t0 = now();
  const cards = S.srs.cards;
  const due = entries.filter((e) => cards[e.w] && cards[e.w].due <= t0).sort((a, b) => cards[a.w].due - cards[b.w].due);
  const fresh = entries.filter((e) => !cards[e.w]).slice(0, 15);
  const queue = [...due, ...fresh].map((e) => e.w);
  S.rv = { active: true, filter: filter || '', queue, idx: 0, flipped: false, stats: { good: 0, again: 0, known: 0 }, requeued: new Set(), entries: new Map(entries.map((e) => [e.w, e])), total: queue.length };
}
function rate(kind) {
  const rv = S.rv; const w = rv.queue[rv.idx]; if (!w) return;
  const old = S.srs.cards[w]; const c = old ? Object.assign({}, old) : { box: 1, due: 0, seen: 0 };
  if (kind === 'again') {
    c.box = 1; c.due = now() + 10 * 60000; c.seen++; S.srs.cards[w] = c; rv.stats.again++;
    if (!rv.requeued.has(w)) { rv.requeued.add(w); rv.queue.push(w); }
  } else if (kind === 'good') {
    c.box = Math.min(5, (old ? c.box : 1) + 1); c.due = now() + BOX_DAYS[c.box] * 86400000; c.seen++; S.srs.cards[w] = c; rv.stats.good++;
  } else { setKnown(w, true); delete S.srs.cards[w]; rv.stats.known++; }
  rv.idx++; rv.flipped = false; saveSrs(); rr();
}
function viewReview() {
  if (S.loadingAll) return '<p class="calm">جاري تحميل الكلمات…</p>';
  const rv = S.rv || (S.rv = { active: false, filter: '' });
  if (rv.active) {
    if (rv.idx >= rv.queue.length) {
      const st = rv.stats;
      return `<div class="page p24"><div class="card pad center stack"><h1>انتهت الجلسة</h1><p class="num">تذكرتها: ${st.good} · لم أتذكرها: ${st.again} · أعرفها: ${st.known}</p><div class="row-btns"><button class="btn primary" id="rv-new" data-act="rvEnd">جلسة جديدة</button><button class="btn ghost" data-act="go" data-to="library" id="rv-lib">المكتبة</button></div></div></div>`;
    }
    const w = rv.queue[rv.idx]; const e = rv.entries.get(w); const f = e.first; const t = getText(f.tid); const s = t.doc.sentences.find((x) => x.id === f.sid); const a = analysisOf(t, f.sid);

function sendChat(text) {
  const sh = S.sheet; if (!sh || sh.type !== 'chat') return;
  const t = getText(sh.tid); const chat = chatOf(sh.tid);
  text = String(text || '').trim(); if (!text || chat.busy) return;
  S.ui['chatIn:' + sh.tid] = '';
  const ta = $('#chat-in'); if (ta) ta.value = '';
  chat.turns.push({ role: 'user', content: text });
  const bot = { role: 'assistant', content: '', pending: true }; chat.turns.push(bot);
  chat.busy = true; chat.ctrl = new AbortController();
  const fs = chat.focus ? t.doc.sentences.find((x) => x.id === chat.focus) : null;
  const intro = C.tutorIntro({ doc: t.doc, course: t.course, focus: fs ? { sentence: fs, analysis: analysisOf(t, fs.id) } : null });
  let hist = chat.turns.slice(0, -1).filter((m) => !m.error && m.content).slice(-12).map((m) => ({ role: m.role, content: m.content }));
  while (hist.length && hist[0].role !== 'user') hist.shift();
  const merged = [];
  hist.forEach((m) => { const l = merged[merged.length - 1]; if (l && l.role === m.role) l.content += '\n\n' + m.content; else merged.push(Object.assign({}, m)); });
  merged[0].content = intro + '\n\n— سؤال الطالب:\n' + merged[0].content;
  updateChatDom();
  AI.stream(merged, { tier: tierOf(), signal: chat.ctrl.signal, onText: ({ text: tx }) => { bot.content = tx; bot.pending = false; updateChatDom(); } })
    .then((r) => { if (r && r.text) bot.content = r.text; if (r && r.truncated) bot.note = 'انقطع الرد — اسأل عن جزء أصغر'; })
    .catch((e) => { if (!isCancel(e)) bot.error = errMsg(e); })
    .finally(() => {

      if (!bot.content && !bot.error) chat.turns.splice(chat.turns.indexOf(bot), 1);

    const q = S.ui.quick;
    if (q && S.route.name === 'text') {
      const t = getText(el.dataset.tid); const w = analysisOf(t, el.dataset.sid).words[Number(el.dataset.i)].w;
      if (q.unknown.has(w)) q.unknown.delete(w); else q.unknown.add(w);
      rr(); return;
    }
    S.sheet = { type: 'word', tid: el.dataset.tid, sid: el.dataset.sid, i: Number(el.dataset.i) }; renderSheet();
  },
  retryChunk: (el) => { const t = dsT(el); if (t) retryChunk(t, el.dataset.c, false); },
  review: (el) => { const t = dsT(el); if (t) reviewChunk(t, el.dataset.c); },
  reanalyze: (el) => { const t = dsT(el); if (t) retryChunk(t, el.dataset.c, true); },
  askSent: (el) => openChat(el.dataset.id, el.dataset.sid, null),
  wordAsk: () => {
    const sh = S.sheet; const t = getText(sh.tid); const w = analysisOf(t, sh.sid).words[sh.i];
    openChat(sh.tid, sh.sid, `اشرح لي كلمة «${w.w}» (${w.py}) في هذه الجملة: ما معناها وإعرابها هنا؟`);
  },
  copyTr: (el) => { const t = dsT(el); const a = analysisOf(t, el.dataset.sid); if (a) copyText(a.translation_ar); },
  sentNav: (el) => {
    const t = dsT(el); if (!t) return; const ui = S.ui.si || (S.ui.si = {});
    ui[t.id] = Math.min(Math.max((ui[t.id] || 0) + Number(el.dataset.d), 0), t.doc.sentences.length - 1); rr(); $('#app').scrollTop = 0;
  },
  moreRows: (el) => { const o = S.ui.rowsOpen || (S.ui.rowsOpen = {}); o[el.dataset.k] = true; rr(); },
  quickOn: () => { if (!S.ui.quick) S.ui.quick = { unknown: new Set() }; rr(); },
  wf: (el) => { S.ui.wf = el.dataset.k; rr(); },
  dedupe: () => { S.ui.dedupe = !S.ui.dedupe; rr(); },
  copyWords: (el) => { const t = dsT(el); copyText(wordList(t).map((x) => `${x.n}. ${x.w.w} — ${x.w.py} — ${x.w.mean}`).join('\n')); },
  toggleParallel: () => { S.ui.parallel = !S.ui.parallel; rr(); },
  toggleGloss: () => { S.ui.gloss = !S.ui.gloss; rr(); },
  copyAll: (el) => { const t = dsT(el); copyText(fullTranslation(t).join('\n\n')); },
  retryOv: (el) => { const t = dsT(el); if (t) retryOverview(t); },
  // practice
  startQuiz: async (el) => {
    const scope = el.dataset.scope;
    if (scope === 'all') {
      go('quiz');
      if (allTexts().some((t) => !isLoaded(t))) await ensureAllLoaded();
      buildQuiz('all'); rr();
    } else { buildQuiz(scope); S.ui.prac = 'quiz'; rr(); }
  },
  pracBack: () => { S.ui.prac = null; rr(); },
  startGrade: () => { S.ui.prac = 'grade'; rr(); },
  startCards: (el) => { buildSession(el.dataset.id); go('review'); },
  quizPick: (el) => { const q = S.quiz; if (q.picked) return; q.picked = el.dataset.g; if (q.picked === q.qs[q.i].group) q.score++; rr(); },
  quizNext: () => { S.quiz.i++; S.quiz.picked = null; rr(); },
  gradePara: (el) => {
    const t = getText(S.route.id); const g = S.grade[t.id]; const ss = paraSentences(t, Number(el.dataset.p));
    const all = ss.every((s) => g.sel.has(s.id)); ss.forEach((s) => (all ? g.sel.delete(s.id) : g.sel.add(s.id))); rr();
  },
  gradeGo: () => gradeRun(getText(S.route.id)),
  gradeAgain: () => { const g = S.grade[S.route.id]; g.result = null; g.sel = new Set(); S.ui['gt:' + S.route.id] = ''; rr(); },
  // review
  rvStart: () => { buildSession(S.rv.filter); rr(); },
  rvFlip: () => { S.rv.flipped = true; rr(); },
  rvRate: (el) => rate(el.dataset.r),
  rvEnd: () => { S.rv = { active: false, filter: S.rv.filter }; rr(); },
  // sheets
  chatSend: () => sendChat(($('#chat-in') || {}).value),
  chatStop: () => { const c = chatOf(S.sheet.tid); if (c.ctrl) c.ctrl.abort(); },
  chatChip: (el) => sendChat(el.dataset.q),
  setTier: (el) => { S.profile.settings.tier = el.dataset.v; saveProfile(); renderSheet(); },
  // Per device (also styles the lock screen, before the profile loads), so localStorage rather than the profile.
  setTheme: (el) => {
    const v = el.dataset.v === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = v;
    try { localStorage.setItem('murib-theme', v); } catch { /* private mode: this visit only */ }
    const m = $('meta[name="theme-color"]'); if (m) m.content = v === 'light' ? '#F3F4F0' : '#121413';
    renderSheet();
  },
  resetAsk: () => { S.confirm = 'resetKnown'; renderSheet(); },
  resetYes: () => { S.confirm = null; S.known = new Set(); S.profile.known = []; saveProfile(); renderSheet(); rr(); toast('تمت إعادة الضبط'); },
};
const CHANGE = {
  pickFiles: (el) => {
    const nt = S.nt; const max = ((AI.limits().images || {}).maxCount) || 8;
    Array.from(el.files || []).filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic)$/i.test(f.name)).forEach((f) => {
      if (nt.photos.length < max) nt.photos.push({ id: 'p' + rand4() + nt.photos.length, file: f, url: URL.createObjectURL(f), rot: 0 });
    });
    el.value = ''; rr();
  },
  toggleKnown: (el) => { setKnown(el.dataset.w, el.checked); rr(); },
  sheetKnown: (el) => { setKnown(el.dataset.w, el.checked); rr(); },
  gradeSel: (el) => { const g = S.grade[S.route.id]; if (el.checked) g.sel.add(el.dataset.sid); else g.sel.delete(el.dataset.sid); rr(); },
  rvFilter: (el) => { S.rv.filter = el.value; rr(); },
  setPinyin: (el) => { S.profile.settings.showPinyin = el.checked; saveProfile(); rr(); },
};
function bindEvents() {
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act]; if (fn) fn(el, ev);
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (S.sheet) { closeSheet(); return; }
      if (S.ui.quick) { S.ui.quick = null; rr(); return; }
    }
    const el = ev.target;
    if ((ev.key === 'Enter' || ev.key === ' ') && el.matches && el.matches('[role="button"][data-act]')) { ev.preventDefault(); el.click(); return; }
    if (ev.key === 'Enter' && !ev.shiftKey && el.id === 'chat-in') { ev.preventDefault(); sendChat(el.value); }
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target.closest('[data-change]'); if (!el) return;
    const fn = CHANGE[el.dataset.change]; if (fn) fn(el);
  });
  document.addEventListener('input', (ev) => {
    const el = ev.target; const m = el.dataset && el.dataset.model; if (!m) return;
    if (m.startsWith('nt.')) {
      S.nt[m.slice(3)] = el.value; saveDraft();
      if (m === 'nt.edBody') { const pv = $('#nt-preview'); if (pv) pv.innerHTML = boldPreview(el.value, S.nt.uncertain); }
      if (m === 'nt.pasteBody') { const b = $('#nt-paste-go'); if (b) b.disabled = !el.value.trim(); }
    } else {
      S.ui[m] = el.value;
      if (m.startsWith('gt:')) rr();
    }
  });
  window.addEventListener('pagehide', () => Saver.flush());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Saver.flush(); });
}

// ───────────── boot ─────────────
async function loadData() {
  S.bootError = ''; S.ready = false; rr();
  try {
    await Store.init();
    S.profile = normProfile(await Store.loadProfile());
    S.srs = (await Store.loadSrs()) || defaultSrs();
    if (!S.srs.cards) S.srs.cards = {};
    const metas = await Store.listTexts();
    S.known = new Set(S.profile.known);
    S.loaded = new Set();
    S.texts = (metas || []).filter((m) => m && m.id && m.doc).map((m) => {
      if (m.analyses) S.loaded.add(m.id);
      else delete m.analyses;
      ensureChunkState(m);
      return m;
    });
  } catch (e) {
    S.bootError = errMsg({ code: 'storage_failed' });
  }
  S.ready = true; rr();
}
let bound = false;
async function boot(opts) {
  opts = opts || {};
  Object.values(S.ctrls).forEach((c) => c.abort());
  Saver.reset(); AI.attach(opts.ai || null); Store = opts.store;
  S.mode = opts.mode || ''; S.mock = S.mode === 'mock'; S.onLock = typeof opts.onLock === 'function' ? opts.onLock : null;
  S.route = { name: 'library' }; S.sheet = null; S.nt = null; S.rv = null; S.quiz = null; S.chats = {}; S.grade = {}; S.ctrls = {}; S.live = new Set();
  S.confirm = null; S.ui.quick = null; S.ui.prac = null;
  if (restoreDraft()) S.route = { name: 'new' };
  document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';
  const app = $('#app'); if (app) app.hidden = false;
  const lb = $('#lock-btn'); if (lb) lb.hidden = !S.onLock;
  const mt = $('#mock-tag'); if (mt) mt.hidden = !S.mock;
  if (!bound) { bound = true; bindEvents(); }
  updateSaveInd();
  await AI.loadLimits();
  await loadData();
}

// busy/settle let the shell finish paid AI work and pending saves before it locks.
window.MuribApp = { boot, busy: () => AI.busy(), settle: () => Saver.settle() };
if (/mock/.test(location.hash)) boot({ ai: makeMockAI(), store: makeMockStore(), mode: 'mock', onLock: null });
})();

</script>
